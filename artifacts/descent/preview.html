<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Descent — live game preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171c24;color:#f5f0f7;font:14px system-ui,sans-serif}canvas{display:block;position:absolute;inset:0;touch-action:none}.caption{position:absolute;top:20px;left:24px;padding:12px 16px;background:#16101ecc;pointer-events:none;border-radius:5px}.caption strong{font-size:18px;font-weight:500}.caption small{display:block;margin-top:5px;color:#ded5e5}.controls{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:10px;flex-direction:column;background:#16101ee8;padding:12px 16px;border-radius:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;background:#34283e;color:#f5f0f7;border:1px solid #786483;border-radius:4px;padding:8px 12px}button{cursor:pointer}button:hover{background:#4d3b5c}input[type=range]{width:100%;accent-color:#c4a5e0}label{display:flex;align-items:center;gap:6px}.hint{color:#d4c8dc;font-size:12px;margin-left:auto}#clock{font-variant-numeric:tabular-nums}#status{position:absolute;inset:0;display:grid;place-items:center;color:#ded5e5;font-size:20px}#status[hidden]{display:none}@media(max-width:600px){.caption{top:12px;left:12px}.controls{left:8px;right:8px;bottom:8px;padding:10px}.hint{display:none}button,select{padding:7px 8px}}
</style>
</head>
<body>
<canvas id="preview"></canvas>
<div id="status" role="status">Preparing the arena…</div>
<div class="caption"><strong id="chapter">The Last Sky</strong><small><span id="clock">0:00</span> · <span id="rate-label">Actual game renderer · paused</span></small></div>
<div class="controls">
 <input id="timeline" type="range" min="0" max="540" step="0.01" value="0" aria-label="Survival time">
 <div class="row"><button id="play" type="button">Play descent</button><label>Speed <select id="speed"><option value="1" selected>1× · actual pace</option><option value="8">8×</option><option value="24">24× · full tour</option></select></label><label>Quality <select id="quality"><option value="high" selected>High</option><option value="low">Low</option></select></label><label><input id="fire" type="checkbox">Fire daggers</label><label>Hand <select id="hand"><option value="1">I · lime</option><option value="2">II · blue</option><option value="3">III · cyan</option><option value="4">IV · violet</option></select></label><span class="hint">Drag to look around</span></div>
 <div class="row"><label>Phase <select id="phase"><option value="0">The Cosmic Expanse</option><option value="21">Cloud boundary</option><option value="30">Ash · The Last Sky</option><option value="69">The Cloud Grave</option><option value="144">The Bruised Veil</option><option value="259">The Furnace</option><option value="380">The Cathedral Below</option><option value="472">The Unlit Depth</option></select></label><button data-range="0,69" type="button">Cosmic opening · 1×</button><button data-range="0,30" type="button">Nebula passage · 1×</button><button data-range="21,30" type="button">Cosmos → ash · 1×</button><button data-range="30,69" type="button">Ash passage · 1×</button><button data-range="69,126" type="button">Cloud Grave · 1×</button><button data-range="51,69" type="button">Ash → cloud grave</button><button data-range="126,144" type="button">Storm → veil</button><button data-range="126,180" type="button">Veil arrival · 1×</button><button id="veil-floor" type="button">Veil floor</button><button id="veil-opening" type="button">Veil opening</button><button data-range="241,289" type="button">Into the Furnace · 1×</button><button data-range="362,410" type="button">Cathedral arrival · 1×</button><button data-range="362,380" type="button">Furnace → cathedral</button><button data-range="454,472" type="button">Cathedral → depths</button></div>
</div>
<script type="module">
import {GameRenderer} from '/src/renderer.ts';
import {World,v,idleInput} from '/src/simulation.ts';
import {DESCENT_CHAPTERS} from '/src/descent.ts';
const canvas=document.getElementById('preview'),status=document.getElementById('status');
const timeline=document.getElementById('timeline'),clock=document.getElementById('clock'),chapter=document.getElementById('chapter'),button=document.getElementById('play'),speed=document.getElementById('speed'),quality=document.getElementById('quality'),rateLabel=document.getElementById('rate-label');
const fire=document.getElementById('fire'),hand=document.getElementById('hand');
try{
 const renderer=new GameRenderer(canvas,{quality:'high',fov:96,skyMotion:'full'});await renderer.prepare();
 const world=new World(17,{schedule:false,invulnerable:true});world.player.pos=v(0,1.7,9);
 for(const [kind,x,y,z] of [['squid',-8,3.3,-12],['spider',8,2,-9],['skull',-3,3,-5],['skull2',5,6,-9],['skull3',0,8,-18]]){
  const e=world.spawn(kind,v(x,y,z));e.pos=v(x,y,z);e.age=20;e.headExposure=.7;e.hp=100000;e.weakpoints.forEach(p=>p.hp=100000);
 }
 for(let i=0;i<6;i++)world.gems.push({id:1000+i,pos:v(-3+i,1,-4),vel:v(),age:2});
 world.effects=[];
 let time=Math.max(0,Math.min(540,Number(new URLSearchParams(location.search).get('time'))||0)),playing=false,rate=1,end=540,last=performance.now(),yaw=0,pitch=.22,drag=null,shotClock=0;
 const refresh=()=>{document.getElementById('phase').value=String(time<21?0:time<30?21:(DESCENT_CHAPTERS.find(c=>c.name===renderer.skyDiagnostics.chapter)?.time??0)+30);timeline.value=String(time);clock.textContent=`${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')}`;chapter.textContent=renderer.skyDiagnostics.chapter;button.textContent=playing?'Pause':'Play descent';rateLabel.textContent=`Environment ${renderer.skyDiagnostics.environmentTime.toFixed(1)}s · ${playing?`${rate}× pace`:'paused'}`;};
 function render(dt=0){world.time=time;renderer.render(world,yaw,pitch,dt,false);refresh();}
 function setTime(value){time=Math.max(0,Math.min(540,value));render();}
 function pause(){playing=false;refresh();}
 function play(){if(time>=end){time=end===540?0:Math.max(0,end-18);}playing=true;last=performance.now();refresh();}
 function setRange(start,finish,speedValue=1){pause();end=finish;rate=speedValue;speed.value=String(rate);setTime(start);play();}
 document.getElementById('phase').onchange=e=>{pause();setTime(Number(e.target.value));};
 button.onclick=()=>{if(playing)pause();else{end=540;play();}};
 speed.onchange=()=>{rate=Number(speed.value);refresh();};
 quality.onchange=()=>{renderer.configure({quality:quality.value,fov:96,skyMotion:'full'});render();};
 hand.onchange=()=>{world.level=Number(hand.value);render();};
 fire.onchange=()=>{shotClock=0;};
 timeline.oninput=()=>{pause();end=540;setTime(Number(timeline.value));};
 document.querySelectorAll('[data-range]').forEach(el=>{el.onclick=()=>{const [start,finish]=el.dataset.range.split(',').map(Number);setRange(start,finish,1);};});
 document.getElementById('veil-floor').onclick=()=>{pause();yaw=0;pitch=-.65;setTime(180);};
 document.getElementById('veil-opening').onclick=()=>{pause();yaw=0;pitch=.55;setTime(180);};
 canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
 canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.004;pitch=Math.max(-1.45,Math.min(1.45,pitch-(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY};render();};
 canvas.onpointerup=()=>{drag=null;};canvas.onpointercancel=()=>{drag=null;};
 function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing||fire.checked||world.projectiles.length){
   if(playing){time=Math.min(end,time+dt*rate);if(time>=end)playing=false;}
   world.time=time;world.tick+=Math.max(1,Math.round(dt*120));
   if(fire.checked){shotClock+=dt;const cadence=world.level===4?.075:.05;while(shotClock>=cadence){world.shoot({...idleInput(),yaw,pitch},false,false);shotClock-=cadence;}}
   world.updateProjectiles(dt);for(const effect of world.effects)renderer.effect(effect,world,yaw,pitch);world.effects=[];
   render(dt);
  }
  requestAnimationFrame(frame);
 }
 window.addEventListener('resize',()=>render());
 window.descentPreview={renderer,world,setTime,setRange,play,pause,setCamera:(newYaw,newPitch)=>{yaw=newYaw;pitch=newPitch;render();},get time(){return time},get playing(){return playing}};
 status.hidden=true;render();requestAnimationFrame(frame);
}catch(error){status.textContent=`The preview could not prepare: ${error.message}`;throw error;}
</script>
</body>
</html>
