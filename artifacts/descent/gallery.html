<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Descent — in-game captures</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#0b090f;color:#ddd5e4;font:14px system-ui,sans-serif}h1{font-size:24px;font-weight:500;margin:0 0 6px}p{color:#aaa0b2;margin:0 0 20px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0}img{display:block;width:100%;aspect-ratio:16/9}figcaption{padding:10px 0;color:#ddd5e4}time{color:#b8a4c8;margin-right:8px;font-variant-numeric:tabular-nums}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.gallery{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>The Descent</h1>
  <p>In-game captures · high quality · same camera and combat fixture</p>
  <div class="gallery">
    <figure><img src="high-0-up.png" alt="Blue skies and pale clouds above the arena"><figcaption><time>0:00</time>The Last Sky</figcaption></figure>
    <figure><img src="high-39-up.png" alt="Dense slate storm clouds"><figcaption><time>0:39</time>The Cloud Grave</figcaption></figure>
    <figure><img src="high-114-up.png" alt="Violet clouds with a receding opening to daylight"><figcaption><time>1:54</time>The Bruised Veil</figcaption></figure>
    <figure><img src="high-259-up.png" alt="Rust and charcoal furnace atmosphere"><figcaption><time>4:19</time>The Furnace</figcaption></figure>
    <figure><img src="high-350-up.png" alt="Immense distant ribs and arches"><figcaption><time>5:50</time>The Cathedral Below</figcaption></figure>
    <figure><img src="high-442-up.png" alt="Dark depths with a faint broken crown overhead"><figcaption><time>7:22</time>The Unlit Depth</figcaption></figure>
  </div>
</body>
</html>
