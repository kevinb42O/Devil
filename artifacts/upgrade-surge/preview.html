<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand attunement • Surge preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#e1e1ef;font:14px system-ui}canvas{display:block}aside{position:fixed;top:24px;left:24px;padding:20px 24px;background:#0c0d16d9;border:1px solid #ffffff1a;border-radius:12px;backdrop-filter:blur(12px)}h1{font-size:17px;margin:0 0 6px}p{color:#9697ad;margin:0 0 18px}button,select{background:#272336;color:#eee;border:1px solid #635879;border-radius:6px;padding:9px 12px;cursor:pointer}label{display:block;margin-top:12px;color:#9697ad;font-size:12px}#status{position:fixed;bottom:30px;left:0;right:0;text-align:center;letter-spacing:.3em;color:#d6c9ef;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body><canvas id="game"></canvas><aside><h1>HAND ATTUNEMENT · GROUND PULSE</h1><p>A pulse through stone. A luminous hand.</p><select id="level"><option value="2">II · Electric blue</option><option value="3">III · Ice cyan</option><option value="4" selected>IV · Arcane violet</option></select> <button id="play">Upgrade ↗</button><label><input id="fire" type="checkbox"> Fire continuously</label><label><input id="loop" type="checkbox" checked> Loop preview</label></aside><div id="status">ATTUNEMENT IV</div><script type="module">
import {GameRenderer} from '/src/renderer.ts';import {World,idleInput,STEP} from '/src/simulation.ts';import {Sound} from '/src/audio.ts';
const renderer=new GameRenderer(document.querySelector('canvas'),{quality:'high',fov:90,mist:false});await renderer.prepare();
const world=new World(1,{schedule:false,invulnerable:true});world.player.pos={x:0,y:1.7,z:0};let clock=0,last=performance.now(),next=1,accumulator=0;const sound=new Sound();
function upgrade(audio=false){const level=Number(document.querySelector('#level').value);world.startAt(0,level,0);world.enemies=[];world.projectiles=[];world.gems=[];world.effects=[];renderer.clear();
for(const [x,z] of [[-3,-5],[0,-8],[3,-6]]){const enemy=world.spawn(level===2?'skull2':level===3?'skull3':'transmuted2',{x,y:1.4,z},false);enemy.age=10;enemy.status='hunting';}
world.emit('upgrade',world.player.pos,level);const effect={kind:'upgrade',level,amount:level,pos:world.player.pos};if(audio){sound.start().then(()=>sound.play(effect,world));}document.querySelector('#status').textContent='ATTUNEMENT '+['','I','II','III','IV'][level];next=clock+3.2;}
document.querySelector('#play').onclick=()=>upgrade(true);document.querySelector('#level').onchange=()=>upgrade(true);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;if(document.querySelector('#loop').checked&&clock>next)upgrade();accumulator+=dt;while(accumulator>=STEP){world.step({...idleInput(),pitch:-.2,fire:document.querySelector('#fire').checked});accumulator-=STEP;}for(const effect of world.effects)renderer.effect(effect,world,0,-.2);world.effects=[];renderer.render(world,0,-.2,dt,false);document.querySelector('#status').style.opacity=renderer.originalWeapon.effectDiagnostics.upgradeTime>.4?'1':'0';requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.upgradePreview={renderer,world,upgrade};
</script></body></html>
